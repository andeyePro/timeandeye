# XcodeGen spec for the andeye iOS app. Generate the project on the Mac:
#   brew install xcodegen   (once)
#   cd ios && xcodegen      → andeye.xcodeproj
# Requires full Xcode (iOS SDK); the CLT-only loop cannot build iOS.
name: andeye
options:
  bundleIdPrefix: com.andeye
  deploymentTarget:
    iOS: "17.0"
packages:
  andeyeTT:
    path: ..
targets:
  andeye:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: andeyeTT
        product: andeyeTTCore
      - package: andeyeTT
        product: andeyeTTStore
      - package: andeyeTT
        product: andeyeTTPhone
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.andeye.ios
        INFOPLIST_KEY_CFBundleDisplayName: andeye
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # iCloud/CloudKit entitlements land AFTER the Apple org conversion —
        # sync stays off until then (the app is fully functional standalone).
        CODE_SIGN_STYLE: Automatic
