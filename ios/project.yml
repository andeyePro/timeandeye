# XcodeGen spec for the andeye iOS app. Generate the project on the Mac:
#   brew install xcodegen   (once)
#   cd ios && xcodegen      → andeye.xcodeproj
# Requires full Xcode (iOS SDK); the CLT-only loop cannot build iOS.
name: andeye
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  timeandeye:
    path: ..
targets:
  andeye:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: timeandeye
        product: timeandeyeCore
      - package: timeandeye
        product: timeandeyeStore
      - package: timeandeye
        product: timeandeyePhone
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Per-app ids across andeye apps (see CHANGELOG 2026-07-09/10): the
        # iOS companion is Time&I, so it takes com.timeandeye.* — set BEFORE
        # any App Store Connect registration exists, while the id is still
        # free to change. This explicit id is the single source (no
        # bundleIdPrefix).
        PRODUCT_BUNDLE_IDENTIFIER: com.timeandeye.ios
        INFOPLIST_KEY_CFBundleDisplayName: "Time&I"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # iCloud/CloudKit entitlements land AFTER the Apple org conversion —
        # sync stays off until then (the app is fully functional standalone).
        CODE_SIGN_STYLE: Automatic
