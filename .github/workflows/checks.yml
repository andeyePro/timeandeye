name: checks
on:
  # Manual + main-only. This workflow was burning the Actions budget:
  # push:["**"] ran the full Swift suite on a macos runner (10x minutes
  # multiplier on a private repo) for EVERY push to every branch, while the
  # Mac build bridge already gates every commit. 2026-07-10: 1,808 of the
  # month's 2,000 included minutes were consumed, mostly in one day of
  # high-frequency verified pushes to FableMax.
  workflow_dispatch:
  push:
    branches: ["main"]

# A newer run supersedes an older one on the same ref - never pay for both.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # The Mac layer imports AppKit/SQLite3, so the suite needs a macOS runner
    # (the harness itself is a plain executable — no XCTest anywhere).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Run the check suite
        run: swift run timeandeyeChecks
