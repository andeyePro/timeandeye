name: checks
on:
  # Manual + main-only, to conserve macOS runner minutes (the Swift suite
  # also runs locally on every commit).
  workflow_dispatch:
  push:
    branches: ["main"]

# A newer run supersedes an older one on the same ref - never pay for both.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # The Mac layer imports AppKit/SQLite3, so the suite needs a macOS runner
    # (the harness itself is a plain executable — no XCTest anywhere).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Run the check suite
        run: swift run timeandeyeChecks
